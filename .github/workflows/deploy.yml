# Build the site and upload it to HostGator whenever main changes.
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER    e.g. ftp.dogbreedsandneeds.com (or the server IP)
#   FTP_USERNAME  e.g. deploy@dogbreedsandneeds.com
#   FTP_PASSWORD
# Optional repository variable FTP_SERVER_DIR: the folder on the server, relative to the
# FTP account's home, ending in a slash. Leave unset if the FTP account opens in the site folder.
name: Deploy to HostGator

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: node src/build.mjs

      - name: Check links, titles, canonicals and sitemap
        run: node tools/check.mjs

      - name: Upload changed files over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          # Only changed files are uploaded; the action keeps a small state file on the server.
          # Files deleted from the site in a later commit are deleted from the server too;
          # files the action never uploaded (e.g. cPanel extras) are left alone.
